version: '3.3'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"   # Porta padrão do RabbitMQ (comunicação AMQP)
      - "15672:15672" # Porta da interface de gerenciamento (HTTP)
    networks:
      - mybridge
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

        #networks:
        #  rabbit_network:
        #    driver: bridge

    networks:
      - mybridge

#networks:
#  mybridge:
#    name: mybridge
#    external: true
#    driver: bridge        

# Configuração das redes que serão usadas no docker-compose.
networks:
  mybridge: # Nome da rede.
    external: # Indica que a rede é externa e já foi criada anteriormente.
      name: mybridge # Nome da rede externa que será usada.

volumes:
  rabbitmq_data:
